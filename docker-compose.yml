version: '3.8'
services:
  backend:
    build: .
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/incidenthub?sslmode=disable
      - JWT_SECRET=default-secret-change-in-production
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always
  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
  db:
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=incidenthub
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data: